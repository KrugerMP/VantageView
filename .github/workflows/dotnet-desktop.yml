name: Build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Restore
      run: dotnet restore src/VantageView.slnx

    - name: Build
      run: dotnet build src/VantageView.slnx --no-restore -c ${{ matrix.configuration }}

    - name: Test
      run: dotnet test src/VantageView.slnx --no-build -c ${{ matrix.configuration }} --verbosity normal
